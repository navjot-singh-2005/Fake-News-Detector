version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthlens-backend
    ports:
      - "8001:8001"
    environment:
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truthlens-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
